name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore SerialScout.sln --locked-mode

      - name: Verify formatting
        run: dotnet format SerialScout.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SerialScout.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SerialScout.sln --configuration Release --no-build --logger "console;verbosity=normal"
