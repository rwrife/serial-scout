name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore SerialScout.sln --locked-mode

      - name: Verify formatting
        run: dotnet format SerialScout.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SerialScout.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SerialScout.sln --configuration Release --no-build --logger "console;verbosity=normal"
