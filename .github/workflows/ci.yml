name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-script-tests:
    name: Release script regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test release validation scripts
        run: ./scripts/test-release-scripts.sh

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            evidence: windows
          - os: macos-15-intel
            evidence: macos-x64
          - os: macos-15
            evidence: macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification
          dotnet restore SerialScout.sln --locked-mode 2>&1 | tee artifacts/verification/restore-${{ matrix.evidence }}.log

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          dotnet format SerialScout.sln --verify-no-changes --no-restore 2>&1 | tee artifacts/verification/format-${{ matrix.evidence }}.log

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification
          dotnet build SerialScout.sln --configuration Release --no-restore 2>&1 | tee artifacts/verification/build-${{ matrix.evidence }}.log

      - name: Record native macOS PTY exclusivity behavior
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang -Wall -Wextra -Werror scripts/probe-macos-pty.c -o "$RUNNER_TEMP/probe-macos-pty"
          "$RUNNER_TEMP/probe-macos-pty" | tee artifacts/verification/pty-native-${{ matrix.evidence }}.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/SerialScout.Core.Tests/SerialScout.Core.Tests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=${{ matrix.evidence }}-core.trx" \
            --results-directory artifacts/verification \
            2>&1 | tee artifacts/verification/test-${{ matrix.evidence }}.log
          dotnet test tests/SerialScout.App.Tests/SerialScout.App.Tests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=${{ matrix.evidence }}-app.trx" \
            --results-directory artifacts/verification \
            2>&1 | tee -a artifacts/verification/test-${{ matrix.evidence }}.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.evidence }}
          path: artifacts/verification
          if-no-files-found: error

  package-gate:
    name: Package and smoke (${{ matrix.rid }})
    if: github.event_name == 'pull_request'
    needs: release-script-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          & ./scripts/package-windows.ps1 -Version "0.0.0-preview.pr${{ github.event.pull_request.number }}" *>&1 |
            Tee-Object artifacts/verification/package-${{ matrix.rid }}.log

      - name: Smoke Windows package
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & ./scripts/smoke-windows.ps1 -Package artifacts/release/SerialScout-0.0.0-preview.pr${{ github.event.pull_request.number }}-win-x64.zip *>&1 |
            Tee-Object artifacts/verification/smoke-${{ matrix.rid }}.log

      - name: Package macOS
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification
          ./scripts/package-macos.sh "0.0.0-preview.pr${{ github.event.pull_request.number }}" "${{ matrix.rid }}" \
            2>&1 | tee artifacts/verification/package-${{ matrix.rid }}.log

      - name: Smoke macOS package
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/smoke-macos.sh "artifacts/release/SerialScout-0.0.0-preview.pr${{ github.event.pull_request.number }}-${{ matrix.rid }}.dmg" \
            2>&1 | tee artifacts/verification/smoke-${{ matrix.rid }}.log

      - name: Upload package-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-gate-${{ matrix.rid }}
          path: |
            artifacts/release
            artifacts/verification
          if-no-files-found: error
